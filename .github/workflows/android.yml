name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Compilar, probar y lint
    runs-on: ubuntu-latest

    steps:
      - name: Descargar código
        uses: actions/checkout@v5

      - name: Configurar JDK 21 (JetBrains Runtime)
        uses: actions/setup-java@v5
        with:
          distribution: jetbrains
          java-version: '21'

      - name: Caché de Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle*', 'gradle/wrapper/gradle-wrapper.properties', 'gradle/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Permiso de ejecución del wrapper
        run: chmod +x gradlew

      - name: Compilar, tests unitarios y lint
        run: ./gradlew assembleDebug testDebugUnitTest lintDebug --no-daemon --stacktrace

      - name: Subir APK debug
        uses: actions/upload-artifact@v4
        with:
          name: adoptme-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
